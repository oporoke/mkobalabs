name: Deploy Mkoba API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.249.48.40
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          # script: |
          #   set -e
          #   cd /var/www/mkobalabs
          #   git pull origin main
          #   npm install --omit=dev
          #   pm2 restart mkoba-app
          script: |
            set -e
            sudo -iu mkoba bash -c 'cd /var/www/mkobalabs; git pull origin main; npm install --omit=dev; node migrate.js; pm2 restart mkoba-app'
            