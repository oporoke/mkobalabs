name: Deploy Mkoba API

on:
  push:
    branches:
      - main

# One deploy at a time; a newer push waits instead of overlapping.
concurrency:
  group: deploy-mkoba
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: for f in *.js; do node --check "$f"; done

      - name: Unit tests
        run: node test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.249.48.40
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            sudo -iu mkoba bash -c 'set -e; cd /var/www/mkobalabs; git pull origin main; npm install --omit=dev; node migrate.js; pm2 startOrReload ecosystem.config.js'
